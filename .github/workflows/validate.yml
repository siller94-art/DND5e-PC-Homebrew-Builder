name: Validate module

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check scripts/main.mjs

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('module.json', 'utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('lang/en.json', 'utf8'))"
